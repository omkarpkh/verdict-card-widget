<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Wiz - Blue Agent verdict card</title>
  <!-- Verdict card for Wiz's Blue Agent in Google SecOps · a drop-in for widgets/get_blue_agent_analysis.html
       Omkar Khadamkar · omkarux.com/verdict-card · Apache-2.0. Source: src/card.ts, built by build.mjs. -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css?family=Source+Sans+Pro:400,600&amp;display=swap" rel="stylesheet">
  <style>
    /* The host's three widget themes (default, light, dark), by the same class names and the
       same colour values its own widgets use, so the card reads as part of the console. */
    :root {
      --bg: #212c44;
      --text: #ffffff;
      --muted: #b5b8c3;
      --line: #3a4a6c;
      --panel: #26334f;
      --link: #8ab4f8;
      --malicious: #ff7a70;
      --suspicious: #fff371;
      --benign: #99d7ca;
      --amber: #fff371;
      --amber-bg: rgba(255, 243, 113, 0.10);
      --font: 'Source Sans Pro', 'Source Sans 3', system-ui, -apple-system, 'Segoe UI', sans-serif;
      --mono: ui-monospace, 'SFMono-Regular', Menlo, Consolas, monospace;
    }
    html.light-theme {
      --bg: #ffffff;
      --text: #0f1029;
      --muted: #585a69;
      --line: #d3d8ea;
      --panel: #f4f5fa;
      --link: #1a57c6;
      --malicious: #b32d21;
      --suspicious: #7a5800;
      --benign: #1b6e44;
      --amber: #7a5800;
      --amber-bg: #fff6d6;
    }
    html.dark-theme {
      --bg: #232330;
      --text: #ffffff;
      --muted: #b5b8c3;
      --line: #3a3a52;
      --panel: #2b2b3a;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; }
    body { background: var(--bg); color: var(--text); font: 400 14px/19px var(--font); overflow-y: auto; -webkit-font-smoothing: antialiased; }
    main { display: grid; gap: 8px; padding: 10px 12px 12px; }
    b { font-weight: 600; }
    a { color: var(--link); text-underline-offset: 2px; }
    .sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
    .head { display: flex; align-items: baseline; gap: 8px; }
    .eyebrow, .block h3 { font: 600 11px/14px var(--font); letter-spacing: 0.06em; text-transform: uppercase; color: var(--muted); }
    .agent { font-weight: 600; }
    .verdict { display: flex; align-items: baseline; flex-wrap: wrap; gap: 4px 14px; }
    .word { font: 600 22px/26px var(--font); }
    .v-malicious .word { color: var(--malicious); }
    .v-suspicious .word { color: var(--suspicious); }
    .v-benign .word { color: var(--benign); }
    .conf { color: var(--muted); }
    .conf b { color: var(--text); }
    .age, .note, .fresh { color: var(--muted); }
    .outdated { border: 1px solid var(--amber); background: var(--amber-bg); border-radius: 4px; padding: 6px 8px; }
    .outdated b { color: var(--amber); }
    .alert-name { color: var(--muted); font-size: 13px; line-height: 17px; margin-top: 2px; }
    .withheld, .revised { border: 1px solid var(--line); background: var(--panel); border-radius: 4px; padding: 6px 8px; }
    .ratings { color: var(--muted); }
    .ratings b { color: var(--text); }
    .block h3 { margin-bottom: 3px; }
    .count { text-transform: none; letter-spacing: 0; font-weight: 400; }
    .claims { list-style: none; display: grid; gap: 6px; counter-reset: claim; }
    .claims li { display: grid; grid-template-columns: 16px 1fr; column-gap: 6px; counter-increment: claim; }
    .claims li::before { content: counter(claim); color: var(--muted); grid-row: span 2; }
    .where { color: var(--muted); font-size: 13px; line-height: 17px; }
    .earlier { margin-top: 6px; }
    .earlier summary { cursor: pointer; color: var(--muted); }
    .earlier p { margin-top: 4px; color: var(--muted); }
    .foot { border-top: 1px solid var(--line); padding-top: 6px; color: var(--muted); font-size: 12px; line-height: 16px; }
    .mono { font-family: var(--mono); font-size: 12px; }
  </style>
</head>
<body>
  <!-- What shows if the console strips the script (Safe HTML rendering). The script replaces it. -->
  <main id="card" aria-live="polite"><p class="note">This card draws with a script, and scripts are switched off here.</p></main>
  <script>
    // The host fills this in from the action's result before the widget loads.
    const actionResult = [{stepInstanceName}.JsonResult];

    // Change these two to reuse the card for another agent.
    const NAMES = { agent: 'Wiz Blue Agent', source: 'Wiz' };

    // @inline card.ts

    let fixedNow = null;
    const now = () => (fixedNow === null ? Date.now() : fixedNow);

    function draw() {
      const model = readCard(actionResult);
      document.getElementById('card').innerHTML = model ? renderCard(model, now(), NAMES) : renderEmpty(NAMES);
    }

    // The host posts its background colour; the widget picks the matching theme. Same contract
    // as the host's own widgets: three known colours, otherwise light when the colour is bright.
    function applyTheme(background) {
      const bg = String(background).toLowerCase().trim();
      let light = bg === '#bdc1c6';
      const dark = bg === '#282837';
      if (!light && !dark && bg !== '#2f3d5c') {
        const rgb = bg.match(/rgba?\((\d+),\s*(\d+),\s*(\d+)/);
        const hex = bg.startsWith('#') ? bg.slice(1) : '';
        const full = hex.length === 3 ? hex.split('').map((c) => c + c).join('') : hex;
        const [r, g, b] = rgb
          ? [Number(rgb[1]), Number(rgb[2]), Number(rgb[3])]
          : full.length === 6
            ? [0, 2, 4].map((i) => parseInt(full.slice(i, i + 2), 16))
            : [NaN, NaN, NaN];
        light = (r * 299 + g * 587 + b * 114) / 1000 > 128;
      }
      document.documentElement.classList.toggle('light-theme', light);
      document.documentElement.classList.toggle('dark-theme', dark);
    }

    window.addEventListener('message', (event) => {
      if (event.source !== window.parent) return;
      const data = event.data;
      if (typeof data !== 'object' || data === null) return;
      const background = data.background || data.backgroundColor;
      if (background) applyTheme(background);
      // Test hook for the prototype and the harness, which run on a fixed clock. A real host never sends it.
      if (typeof data.verdictCardNow === 'number') {
        fixedNow = data.verdictCardNow;
        draw();
      }
    });

    draw();
    // Age is the point, so it keeps counting while the case is open.
    setInterval(draw, 60000);
  </script>
</body>
</html>
